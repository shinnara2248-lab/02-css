<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrap{
            border: 2px solid;
            display: flex;
        }

        .wrap>div{
            flex-basis: 200px;
            height: 100px;
        }

        .box1{
            background: lightpink;
        }
        .box2{
            background: lightsalmon;
        }
    </style>
</head>
<body>
    <h1>flex-basis</h1>
    <p>flex-box의 자식요소에 너비를 줄 때 사용한다</p>
    <p>기본값을 0으로 세팅하면 비율로 요소가 만들어진다</p>
    <div class="wrap">
        <div class="box1">box1</div>
        <div class="box2">box2</div>
    </div>
</body>
</html>
