<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 80px;
            height: 80px;
            background: rgb(221, 201, 227);
            border: 2px solid;
            transition: 1s;
        }
        #box1:hover{
            transform: translateX(500px);
            background: rgb(255, 221, 221);
        }
        #box2:hover{
            transform: scale(2);
            background: rgb(255, 220, 155);
            /* width: 160px;
            height: 160px; */
        }
        #box3:hover{
            transform: rotate(180deg);
            background: rgb(226, 224, 140);
        }
        #box4:hover{
            transform: skew(45deg);
            background: rgb(221, 255, 221);
        }
        #box5:hover{
            transform: scale(2) rotate(360deg);
            background: rgb(169, 226, 231);
        }

        #box1:target{
            transform: translate(500px, 300px);
        }
    </style>
</head>
<body>
    <h1>transiform</h1>
    <p>요소들을 변형 시킬때 사용한다</p>
    <p>위치, 크기=scale, 기울기, 회전</p>

    <a href="#box1">box1</a>
    <hr>
    <div id="box1">box1</div>
    <div id="box2">box2</div>
    <div id="box3">box3</div>
    <div id="box4">box4</div>
    <div id="box5">box5</div>
</body>
</html>
