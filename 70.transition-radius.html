<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .img-box{
            width: 400px;
            height: 400px;
            border-radius: 40px;
            overflow: hidden;
            transition: 0.5s;
        }
        .img-box:hover{
            border-radius: 0;
        }
        .img-box>img{
            width: 100%;
            transition: 0.5s;
        }

        .img-box:hover>img{
            transform: scale(1.3);
        }
    </style>
</head>

<body>
    <div class="img-box">
        <img src="./images/20260623213618_1800040360066_P0yMBQ2PbN.jpg" alt="">
    </div>
</body>

</html>
