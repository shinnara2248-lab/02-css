<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 기본 글자크기는 16px */
    .text1{
        /* px, em, rem */
letter-spacing:-0.05em;
    }
    .text2{
        font-family: "pretendard",sans-serif;
    }

    .word2{
        word-spacing: 2em;
    }
    </style>
</head>
<body>
    <h1>letter spacing</h1>
<p class="text1">글자와 글자 사이의 간격을 조절할 때 사용한다</p>
<p class="text2">글자와 글자 사이의 간격을 조절할 때 사용한다</p>

<h1>word spacing</h1>
<p class="word1">단어와 단어 사이의 간격을 조절할때</p>
<p class="word2">단어와 단어 사이의 간격을 조절할때</p>

</body>
</html>
