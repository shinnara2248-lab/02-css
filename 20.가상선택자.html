<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/20-link.css">
</head>

<body>
    <h1>가상 선택자</h1>
    <p>마크업에 넣은적이 없는 요소를 선택자로 사용할때</p>
    <p>a 링크기능을 가지는 요소를
        링크기능 :link
        마우스가 올라갔을때 :hover
        마우스를 다운했을때 :active
        마우스르 클릭후 방문했을때 :visited
    </p>

    <!-- ul.list>li*3>a[href="#"]{list$} -->
    <ul class="list">
        <li><a href="#">list1</a></li>
        <li><a href="#">list2</a></li>
        <li><a href="#">list3</a></li>
    </ul>
</body>

</html>
