<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1+h2{
            background: rgb(255, 199, 208);
        }
        h1~p{
            color: rgb(72, 148, 112);
        }
    </style>
</head>
<body>
    <h1>형제선택자, 이후 선택자</h1>

    <h2>형제선택자</h2>
    <p>바로 다음에 오는 형제</p>

    <h2>이후선택자</h2>
    <p>동생들</p>
</body>
</html>
