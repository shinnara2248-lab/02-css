<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: url(./images/bg.jpg);
        }

        .btn>a {
            display: flex;
            width: 154px;
            height: 55px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Permalink - use to edit and share this gradient: https://colorzilla.com/gradient-editor/#c0f4ab+0,f2e793+100 */
            background: linear-gradient(to bottom, rgba(192, 244, 171, 1) 0%, rgba(242, 231, 147, 1) 100%);
            /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
            border-radius: 30px;
            text-decoration: none;
            color: rgb(255, 111, 0);
            font-weight: 600;
            box-shadow: 1px 1px 1px rgba(0, 0, 0, 0.29), 1px 1px 1px 1px rgba(255, 255, 255, 0.4) inset;
            text-shadow: 1px 1px 1px rgba(248, 21, 21, 0.2);
        }
        .btn>a em{
            font-size: 12px;
            font-weight: 300;
            font-family: georgia, 'Times New Roman', Times, serif;
        }
    </style>
</head>

<body>
    <div class="btn">
        <a href="#">SIGN IN <em>One minute</em></a>
    </div>
</body>

</html>
