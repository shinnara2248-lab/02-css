<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrap{
            border: 5px solid;
            /* height를 준다:자식요소가 변하면 다시 계산해야한다는 단점이 있다 */
            /* overflow */
            /* height: 200px; */
            /* overflow: auto; */
        }
        .wrap::after{
            content: "";
            display: block;
            clear: left;
        }
        .wrap>div{
            width: 150px;
            height: 100px;
            border: 2px solid gray;
        }
        .wrap>.box1{
            float: left;
            background: pink;
        }
        .wrap>.box2{
            width: 200px;
            height: 200px;
            background: skyblue;
            float: left;
        }
        .wrap>.box3{
            background: papayawhip;
            float: left;
        }
        .wrap>.box4{
            background: lightsalmon;
            float: left;
        }
    </style>

</head>
<body>
    <h1>float</h1>
    <p>자식요소를 부모요소 안에서 왼쪽 또는 오른쪽에 배치할때 사용한다</p>
    <p>뜨다라는 뜻을 가지고 있다, 공중부양</p>

    <div class="wrap">
        <div class="box1">box1</div>
        <div class="box2">box2</div>
        <div class="box3">box3</div>
        <div class="box4">box4</div>
    </div>
    <p>!!여기가 끝!!</p>
</body>
</html>
