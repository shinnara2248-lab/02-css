<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: #111;
        }

        .button {
            width: 200px;
            height: 60px;
            /* Permalink - use to edit and share this gradient: https://colorzilla.com/gradient-editor/#a3f5ff+0,ffaaaa+100 */
            background: linear-gradient(to bottom, #a3f5ff 0%, #ffaaaa 100%);
            /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
            border-radius: 60px;
            color: aliceblue;
            font-size: 30px;
            text-align: center;
            line-height: 60px;
            border: 2px solid #fff;
            position: relative;
        }

        .button::before {
            content: "";
            display: block;
            width: 190px;
            height: 40px;
            /* Permalink - use to edit and share this gradient: https://colorzilla.com/gradient-editor/#ffffff+0,ffffff+100&1+0,0+50 */
            background: linear-gradient(to bottom, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 50%, rgba(255, 255, 255, 0) 100%);
            /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
            position: absolute;
            border-radius: 40px;
            left: 5px;
            top: 1px;
        }
    </style>
</head>

<body>
    <div class="button">button</div>
</body>

</html>
