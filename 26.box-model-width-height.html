<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1 {
            background: pink;
            width: 50%;
            height: 150px;
        }

        .box2 {
            background: skyblue;
            width: 200px;
            height: 100px;
        }

        span {
            background: green;
            width: 200px;
            height: 150px;
        }
    </style>
</head>

<body>
    <h1>box model</h1>
    <p>블럭요소에 주는 속성을 뜻한다. 예외로 img에도 적용</p>
    <p>width-너비를 줄때,block, img</p>
    <p>height-높이를 줄때,block, img</p>
    <p>border-테두리를 줄때,모두가능</p>
    <p>border-radius-모서리 둥글게,모두가능</p>
    <p>margin-바깥여백,인라인에서는 왼쪽 오른쪽만 적용</p>
    <p>padding-안쪽 여백,인라인에서는 왼쪽 오른쪽만 적용</p>
    <hr>
    <div class="box1">box1</div>
    <div class="box2">box2</div>
    <div class="box3">box3</div>
    <span>span</span>
</body>

</html>
