<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrap{
            background-color: hotpink;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            /* gap: 10px; */
            column-gap: 10px;
            row-gap: 20px;
        }

        .wrap>div{
            background-color: gainsboro;
            border: 1px solid navy;
        }

        .wrapColumn>.grid1{
            /* grid-column-start: 1; */
            /* grid-column-end: 3; */
            /* grid-column:시작위치/끝위치 */
            grid-column: 1/3;
        }

        .wrapRow>.grid1{
            grid-row: 1/4;
        }

        .fa-wrap{
            background: #ccc;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 24px;
        }

        .fa-wrap>div{
            background: lightsalmon;
        }

        .fa-wrap>.box1{
            grid-column: 1/4;
            grid-row: 1/3;
        }

        .fa-wrap>.box2{
            grid-column: 4/6;
        }
    </style>
</head>
<body>
    <h1>grid-column</h1>
    <p>그리드 칸 합치기</p>
    <div class="wrap wrapColumn">
        <div class="grid1">1</div>
        <div class="grid2">2</div>
        <div class="grid3">3</div>
        <div class="grid4">4</div>
        <div class="grid5">5</div>
        <div class="grid6">6</div>
        <div class="grid7">7</div>
        <div class="grid8">8</div>
    </div>

    <h1>grid-row</h1>
    <p>그리드 줄 합치기</p>
    <div class="wrap wrapRow">
        <div class="grid1">1</div>
        <div class="grid2">2</div>
        <div class="grid3">3</div>
        <div class="grid4">4</div>
        <div class="grid5">5</div>
        <div class="grid6">6</div>
        <div class="grid7">7</div>
        <div class="grid8">8</div>
    </div>

    <hr>

    <div class="fa-wrap">
        <div class="box1">box1</div>
        <div class="box2">box2</div>
        <div class="box3">box3</div>
        <div class="box4">box4</div>
    </div>
</body>
</html>
