<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn{
            width: 180px;
            height: 60px;
            border: 1px solid;
            border-radius: 60px;
            text-align: center;
            line-height: 60px;
            margin: 50px auto;
            position: relative;
            overflow: hidden;
        }
        .btn::before{
            content: "000";
            display: block;
            width: 200px;
            height: 200px;
            background: rgb(255, 181, 181);
            border-radius: 50%;
            position: absolute;
            left: -120%;
            top: 50%;
            transform: translateY(-50%);
            transition: 0.3s;
        }
        .btn>span{
            position: relative;
            transition: 0.3s;
        }

        .btn:hover::before{
            left: 0;
        }

        .btn:hover>span{
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="btn">
        <span>button</span>
    </div>
</body>
</html>
