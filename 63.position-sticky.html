<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            background: lightgoldenrodyellow;
            padding: 30px;
            position: sticky;
            top: 0;
        }

        main>div{
            height: 300px;
            background-color: #cbe881;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>position</h1>
    <p>sticky - 지정한 위치에 갔을때 고정</p>
    <header>여기는 sticky header</header>
    <main>
        <div class="box">box1</div>
        <div class="box">box2</div>
        <div class="box">box3</div>
        <div class="box">box4</div>
        <div class="box">box5</div>
    </main>
</body>
</html>
