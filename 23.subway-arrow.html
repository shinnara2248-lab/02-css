<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .arrow-list>li>a{
            display: block;
            background-color: pink;
            background-image: url(./images/arrow-btn.png);
            width: 50px;
            height: 50px;
            text-indent: -9999px;
        }
        .arrow-list>.right-arrow>a{
            background-position: -50px 0;
        }
        .arrow-list>.left-arrow>a:hover{
            background-position: 0 -50px;
        }
        .arrow-list>.right-arrow>a:hover{
            background-position: -50px -50px;
        }
    </style>
</head>

<body>
    <h1>subway arrow</h1>
    <ul class="arrow-list">
        <li class="left-arrow"><a href="#">left</a></li>
        <li class="right-arrow"><a href="#">right</a></li>
    </ul>
</body>

</html>
